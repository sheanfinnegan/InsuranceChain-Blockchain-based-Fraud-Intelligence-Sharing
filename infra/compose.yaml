      - orderer3:/var/hyperledger/production/orderer
    networks:
      insurance:
        aliases: [orderer3.insurance.local]
  couch1:
    image: couchdb:3.3.3
    container_name: ic-couch1
    environment: { COUCHDB_USER: insurance, COUCHDB_PASSWORD: '${COUCHDB_PASSWORD}' }
    volumes: ['couch1:/opt/couchdb/data']
    networks: [insurance]
  peer1:
    image: hyperledger/fabric-peer:2.5.16
    container_name: ic-peer1
    hostname: peer0.org1.insurance.local
    environment:
      CORE_PEER_ID: peer0.org1.insurance.local
      CORE_PEER_ADDRESS: peer0.org1.insurance.local:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.org1.insurance.local:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.org1.insurance.local:7051
      CORE_PEER_GOSSIP_USELEADERELECTION: 'true'
      CORE_PEER_GOSSIP_ORGLEADER: 'false'
      CORE_PEER_LOCALMSPID: Org1MSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
      CORE_PEER_TLS_ENABLED: 'true'
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
      CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
      CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: insurancechain_network
      CORE_LEDGER_STATE_STATEDATABASE: CouchDB
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couch1:5984
      CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME: insurance
      CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD: ${COUCHDB_PASSWORD}
      CORE_CHAINCODE_EXECUTETIMEOUT: 300s
    ports: ['127.0.0.1:17051:7051']
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../.runtime/crypto/peerOrganizations/org1.insurance.local/peers/peer0.org1.insurance.local/msp:/etc/hyperledger/fabric/msp:ro
      - ../.runtime/crypto/peerOrganizations/org1.insurance.local/peers/peer0.org1.insurance.local/tls:/etc/hyperledger/fabric/tls:ro
      - peer1:/var/hyperledger/production
