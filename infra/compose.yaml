name: insurancechain
services:
  postgres:
    image: postgres:15-alpine
    container_name: ic-postgres
    environment:
      POSTGRES_USER: insurance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: insurancechain
    ports: ['127.0.0.1:15432:5432']
    volumes: ['postgres:/var/lib/postgresql/data']
    networks: [insurance]
  storage:
    image: rustfs/rustfs:latest
    container_name: ic-storage
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
    ports: ['127.0.0.1:19000:9000', '127.0.0.1:19001:9001']
    volumes: ['storage:/data']
    networks: [insurance]
  orderer1:
    image: hyperledger/fabric-orderer:2.5.16
    container_name: ic-orderer1
    hostname: orderer1.insurance.local
    environment:
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_BOOTSTRAPMETHOD: file
      ORDERER_GENERAL_BOOTSTRAPFILE: /var/hyperledger/orderer/genesis.block
      ORDERER_GENERAL_TLS_ENABLED: 'true'
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
    ports: ['127.0.0.1:17050:7050']
    volumes:
      - ../.runtime/genesis.block:/var/hyperledger/orderer/genesis.block:ro
      - ../.runtime/crypto/ordererOrganizations/insurance.local/orderers/orderer1.insurance.local/msp:/var/hyperledger/orderer/msp:ro
      - ../.runtime/crypto/ordererOrganizations/insurance.local/orderers/orderer1.insurance.local/tls:/var/hyperledger/orderer/tls:ro
      - orderer1:/var/hyperledger/production/orderer
    networks:
      insurance:
        aliases: [orderer1.insurance.local]
  orderer2:
    image: hyperledger/fabric-orderer:2.5.16
    container_name: ic-orderer2
    hostname: orderer2.insurance.local
    environment:
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_BOOTSTRAPMETHOD: file
      ORDERER_GENERAL_BOOTSTRAPFILE: /var/hyperledger/orderer/genesis.block
      ORDERER_GENERAL_TLS_ENABLED: 'true'
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
    ports: ['127.0.0.1:18050:7050']
    volumes:
      - ../.runtime/genesis.block:/var/hyperledger/orderer/genesis.block:ro
      - ../.runtime/crypto/ordererOrganizations/insurance.local/orderers/orderer2.insurance.local/msp:/var/hyperledger/orderer/msp:ro
      - ../.runtime/crypto/ordererOrganizations/insurance.local/orderers/orderer2.insurance.local/tls:/var/hyperledger/orderer/tls:ro
      - orderer2:/var/hyperledger/production/orderer
    networks:
      insurance:
        aliases: [orderer2.insurance.local]
  orderer3:
    image: hyperledger/fabric-orderer:2.5.16
    container_name: ic-orderer3
    hostname: orderer3.insurance.local
    environment:
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_BOOTSTRAPMETHOD: file
